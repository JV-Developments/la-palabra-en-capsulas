<style>
:root{--blue:#0F4C81;--cream:#F8F4EC;--gold:#B99A59;--ink:#17365D}
*{box-sizing:border-box}
body{margin:0;background:var(--blue);font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);font-size:17px;line-height:1.75}
.language-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:14px 12px 4px;max-width:1000px;margin:0 auto}
.language-bar button{border:1px solid var(--gold);background:var(--cream);color:var(--blue);border-radius:5px;padding:7px 11px;font:600 14px "Segoe UI",Arial,sans-serif;cursor:pointer}
.language-bar button[aria-pressed="true"]{background:var(--gold);color:#fff}
main{width:min(900px,calc(100% - 28px));margin:14px auto 30px;padding:26px 24px 30px;background:var(--cream);border-radius:8px;text-align:center;box-shadow:0 4px 16px #0002}
.hero-image{display:block;width:min(100%,680px);height:auto;max-height:390px;object-fit:contain;margin:0 auto 18px}
.message{max-width:760px;margin:0 auto 22px;text-align:justify}
.square-button{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;border-radius:5px;padding:11px 22px;border:1px solid var(--gold);line-height:1.45;margin:2px auto 20px}
.square-button:hover{background:#17365D}
.square-button[aria-disabled="true"]{opacity:.55;pointer-events:none;cursor:not-allowed}
.back-link{display:inline-block;color:var(--blue);font-weight:600;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px}
.back-link:hover{color:#8A6D32}
@media(max-width:600px){body{font-size:16px}.language-bar{gap:5px;padding-top:10px}.language-bar button{padding:6px 8px;font-size:13px}main{padding:18px 16px 24px;margin-top:10px}.hero-image{max-height:none}.square-button{max-width:100%;padding:10px 16px}}
</style>

de:{title:'Unterstützen — Das Wort in Kapseln',alt:'Das Wort in Kapseln unterstützen',message:'Beiträge für LPC in jeder Höhe ermöglichen es uns, mehr Zeit in die Erstellung von Inhalten zu investieren und weiterhin Materialien anzubieten, die das Denken, die Überzeugungen und den Glauben unserer Leser positiv stärken.',button:'Ja, ich möchte LPC unterstützen',back:'← Zurück zum Menü'},

ja:{title:'支援する — カプセルに込められた御言葉',alt:'カプセルに込められた御言葉を支援する',message:'LPCへのご寄付は、金額を問わず、コンテンツ制作により多くの時間を充てる助けとなります。そして、読者の考え方や信念、信仰の成長に良い影響を与える資料を引き続き提供できるようになります。',button:'はい、LPCを支援したいです',back:'← メニューに戻る'},

tr:{title:'Destek Ol — Kapsüllerde Söz',alt:'Kapsüllerde Söz’e destek olun',message:'LPC’ye yapacağınız her katkı, içerik hazırlamak için daha fazla zaman ayırmamıza yardımcı olur. Böylece okuyucularımızın düşüncelerine, kanaatlerine ve inançlarına olumlu katkı sağlayan materyaller sunmayı sürdürebiliriz.',button:'Evet, LPC’ye destek olmak istiyorum',back:'← Menüye dön'},

el:{title:'Στηρίξτε — Ο Λόγος σε Κάψουλες',alt:'Στηρίξτε τον Λόγο σε Κάψουλες',message:'Κάθε συνεισφορά σας προς το LPC μάς επιτρέπει να αφιερώνουμε περισσότερο χρόνο στην προετοιμασία περιεχομένου, ώστε να συνεχίσουμε να προσφέρουμε υλικό που συμβάλλει θετικά στη σκέψη, στις πεποιθήσεις και στην πίστη των αναγνωστών μας.',button:'Ναι, θέλω να στηρίξω το LPC',back:'← Επιστροφή στο μενού'},

fa:{title:'حمایت کنید — کلام در کپسول‌ها',alt:'از کلام در کپسول‌ها حمایت کنید',message:'هر کمک شما به LPC به ما امکان می‌دهد زمان بیشتری برای آماده‌سازی محتوا اختصاص دهیم تا بتوانیم همچنان مطالبی ارائه کنیم که تأثیر مثبتی بر اندیشه، باورها و ایمان خوانندگانمان داشته باشد.',button:'بله، می‌خواهم از LPC حمایت کنم',back:'بازگشت به منو ←'},

sv:{title:'Stöd — Ordet i kapslar',alt:'Stöd Ordet i kapslar',message:'Ditt bidrag till LPC hjälper oss att ägna mer tid åt att skapa innehåll, så att vi kan fortsätta erbjuda material som bidrar positivt till våra läsares tankar, övertygelser och tro.',button:'Ja, jag vill stödja LPC',back:'← Tillbaka till menyn'},

ko:{title:'후원하기 — 캡슐 속의 말씀',alt:'캡슐 속의 말씀 후원하기',message:'LPC에 보내주시는 모든 후원은 콘텐츠를 준비하는 데 더 많은 시간을 할애할 수 있도록 도와줍니다. 이를 통해 독자들의 생각과 신념, 믿음에 긍정적인 영향을 주는 자료를 계속 제공할 수 있습니다.',button:'네, LPC를 후원하고 싶습니다',back:'← 메뉴로 돌아가기'},

pl:{title:'Wesprzyj — Słowo w Kapsułkach',alt:'Wesprzyj Słowo w Kapsułkach',message:'Każda wpłata na rzecz LPC pozwala nam poświęcić więcej czasu na przygotowywanie treści, aby nadal oferować materiały, które pozytywnie wpływają na sposób myślenia, przekonania i wiarę naszych czytelników.',button:'Tak, chcę wesprzeć LPC',back:'← Powrót do menu'},

bn:{title:'সহায়তা করুন — ক্যাপসুলে বাক্য',alt:'ক্যাপসুলে বাক্যকে সহায়তা করুন',message:'LPC-তে আপনার যেকোনো অনুদান আমাদের বিষয়বস্তু প্রস্তুত করার জন্য আরও সময় দিতে সাহায্য করে, যাতে আমরা আমাদের পাঠকদের চিন্তাভাবনা, বিশ্বাস ও আস্থায় ইতিবাচক অবদান রাখে এমন উপকরণ প্রকাশ করে যেতে পারি।',button:'হ্যাঁ, আমি LPC-কে সহায়তা করতে চাই',back:'← মেনুতে ফিরে যান'}
};

es:'support-es.png',
en:'support-en.png',
zh:'support-zh.png',

el:'support-el.png',
fa:'support-fa.png',
sv:'support-sv.png',
ko:'support-ko.png',
pl:'support-pl.png',
bn:'support-bn.png'
};

const paymentLinkByLanguage={
es:'https://square.link/u/Et13J8m1',
en:'https://square.link/u/F8rZyhRi',
fr:'https://square.link/u/96UuC9kW',
tr:'https://square.link/u/xpZF70rM',
zh:'https://square.link/u/FjZJ3PGP',
it:'https://square.link/u/lIqpDRfa',
de:'https://square.link/u/D67maHj5',
pt:'https://square.link/u/EMrglEry',
ru:'https://square.link/u/6kXtbg05',
he:'https://square.link/u/hAccr7fa',
ja:'https://square.link/u/zjfkrJMu',
hi:'https://square.link/u/v60ZlTMR',
ar:'https://square.link/u/7rxr0R1W',
el:'https://square.link/u/t2fCVx4m',
fa:'https://square.link/u/DyP6dDVl',
sv:'https://square.link/u/KwZeL6nC',
pl:'https://square.link/u/zmTBT9xC',
ko:'https://square.link/u/XpCmRRyp',
bn:'https://square.link/u/iGaiYd7G'
};

const image=document.getElementById('support-image');
const message=document.getElementById('support-message');
const button=document.getElementById('support-button');
const back=document.getElementById('back-link');

function setLanguage(lang){
 if(!languages.includes(lang))lang='es';

 const t=translations[lang];

 document.documentElement.lang=lang==='zh'?'zh-CN':lang;
 document.documentElement.dir=(lang==='he'||lang==='ar'||lang==='fa')?'rtl':'ltr';

 document.title=t.title;
 image.src=imageByLanguage[lang]||'support-en.png';
 image.alt=t.alt;
 message.textContent=t.message;
 button.textContent=t.button;
 back.textContent=t.back;
 back.href='../menu.html?lang='+lang;

 const payment=paymentLinkByLanguage[lang];

 if(payment){
  button.href=payment;
  button.removeAttribute('aria-disabled');
  button.removeAttribute('tabindex');
  button.style.pointerEvents='';
  button.style.opacity='';
  button.target='_blank';
  button.rel='noopener noreferrer';
 }else{
  button.removeAttribute('href');
  button.setAttribute('aria-disabled','true');
  button.setAttribute('tabindex','-1');
  button.style.pointerEvents='none';
  button.style.opacity='.55';
 }

 document.querySelectorAll('[data-language]').forEach(el=>
  el.setAttribute('aria-pressed',String(el.dataset.language===lang))
 );

 try{localStorage.setItem('lpc-language',lang);}catch(e){}
}

document.querySelectorAll('[data-language]').forEach(el=>
 el.addEventListener('click',()=>setLanguage(el.dataset.language))
);

let initial='es';

try{
 const params=new URLSearchParams(location.search);
 const fromUrl=params.get('lang');
 const saved=localStorage.getItem('lpc-language');

 if(languages.includes(fromUrl))initial=fromUrl;
 else if(languages.includes(saved))initial=saved;
}catch(e){}

setLanguage(initial);
})();
