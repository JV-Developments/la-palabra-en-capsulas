<style>
:root{
  --text:#252525;
  --muted:#666;
  --accent:#17365D;
  --blue:#0F4C81;
  --paper:#F8F4EC;
  --bg:#f2f0ec;
  --line:#d9d4cc;
  --hover:#e6f0fa;
  --hover-line:#b3d1ff;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
}

.page{
  max-width:900px;
  margin:38px auto 50px;
  padding:42px 48px 46px;
  background:var(--paper);
  border:1px solid #e1ddd5;
  box-shadow:0 5px 22px rgba(0,0,0,.06);
}

h1{
  margin:0;
  text-align:center;
  color:var(--accent);
  font-size:36px;
  line-height:1.3;
  font-weight:700;
}

.subtitle{
  margin:12px auto 34px;
  max-width:680px;
  text-align:center;
  color:#555;
  font-size:18px;
  line-height:1.7;
}

.project-box{
  margin:0 auto;
  padding:30px 32px;
  max-width:780px;
  background:var(--hover);
  border:1px solid var(--hover-line);
  border-left:5px solid var(--blue);
  border-radius:5px;
  transition:background .2s ease,border-color .2s ease;
}

.project-box:hover{
  background:#edf4fb;
  border-color:#a9c9ed;
}

.project-box p{
  margin:0;
  color:#333;
  font-size:17px;
  line-height:1.9;
  text-align:justify;
  text-justify:inter-word;
  hyphens:auto;
}

.project-box p+p{margin-top:22px}

.buttons{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-top:36px;
  flex-wrap:wrap;
}

.button{
  display:inline-block;
  padding:11px 20px;
  text-decoration:none;
  border-radius:3px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:14px;
  font-weight:bold;
  text-align:center;
}

.button.primary{
  background:var(--blue);
  color:white;
}

.button.secondary{
  background:transparent;
  color:var(--accent);
  border:1px solid #bdb7ae;
}

.button:hover{filter:brightness(.94)}

footer{
  margin-top:36px;
  padding-top:20px;
  border-top:1px solid var(--line);
  text-align:center;
  color:#777;
  font-size:14px;
}

.language-bar{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin:0 0 24px;
  flex-wrap:wrap;
  font:13px/1.8 Georgia,"Times New Roman",serif;
}

.lang-link{
  padding:2px 0;
  border:0;
  background:transparent;
  color:#666;
  font:inherit;
  cursor:pointer;
  text-decoration:none;
}

.lang-link:hover,
.lang-link.active{color:var(--blue)}

.lang-link.active{font-weight:700}

.lang-divider{
  color:#aaa;
  user-select:none;
}

.lang-link:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:4px;
}

/* Escritura de derecha a izquierda */
html[lang="he"] .project-box,
html[lang="ar"] .project-box,
html[lang="fa"] .project-box{
  direction:rtl;
}

html[lang="he"] .project-box p,
html[lang="ar"] .project-box p,
html[lang="fa"] .project-box p{
  text-align:right;
  text-justify:auto;
  line-height:2;
  font-family:Tahoma,Arial,sans-serif;
}

html[lang="he"] .project-box,
html[lang="ar"] .project-box,
html[lang="fa"] .project-box{
  border-left:1px solid var(--hover-line);
  border-right:5px solid var(--blue);
}

html[lang="he"] .subtitle,
html[lang="ar"] .subtitle,
html[lang="fa"] .subtitle,
html[lang="he"] .button,
html[lang="ar"] .button,
html[lang="fa"] .button{
  font-family:Tahoma,Arial,sans-serif;
}

@media(max-width:700px){
  .page{
    margin:0;
    padding:25px 20px 36px;
    border:none;
    box-shadow:none;
  }

  h1{font-size:31px}

  .subtitle{
    font-size:17px;
    margin-bottom:28px;
  }

  .project-box{padding:23px 20px}

  .project-box p{
    font-size:17px;
    line-height:1.9;
  }

  .project-box p+p{margin-top:20px}
  .buttons{margin-top:30px}

  .language-bar{
    margin-bottom:22px;
    gap:7px;
    font-size:12px;
  }
}
</style>
</head>

  window.changeLanguage=function(lang){

    if(!Object.prototype.hasOwnProperty.call(T,lang)){
      lang='es';
    }

    const t=T[lang];

    document.documentElement.lang =
      lang==='zh' ? 'zh-CN' : lang;

    document.documentElement.dir=t.dir;
    document.title=t.title;

    document.getElementById('page-title').textContent=t.h1;
    document.getElementById('subtitle').textContent=t.subtitle;
    document.getElementById('project-text-1').textContent=t.text1;
    document.getElementById('project-text-2').textContent=t.text2;
    document.getElementById('vision-link').textContent=t.vision;
    document.getElementById('back-link').textContent=t.back;
    document.getElementById('footer').textContent=t.footer;

    const projectBox=document.getElementById('project-box');
    projectBox.setAttribute('aria-label',t.aria);
    projectBox.setAttribute('dir',t.dir);

    document.querySelectorAll('.lang-link').forEach(function(button){
      const selected=button.id==='link-'+lang;
      button.classList.toggle('active',selected);
      button.setAttribute('aria-pressed',String(selected));
    });

    try{
      localStorage.setItem('lpc-language',lang);
    }catch(e){}
  };

  let initial='es';

  try{
    const params=new URLSearchParams(window.location.search);
    const requested=params.get('lang');

    if(requested && Object.prototype.hasOwnProperty.call(T,requested)){
      initial=requested;
    }else{
      const saved=localStorage.getItem('lpc-language');

      if(saved && Object.prototype.hasOwnProperty.call(T,saved)){
        initial=saved;
      }
    }
  }catch(e){}

  changeLanguage(initial);

})();
</script>
