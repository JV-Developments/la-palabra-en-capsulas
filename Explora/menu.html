<style>
:root {
  --blue: #0F4C81;
  --gold: #e7c96f;
  --white: #fff;
  --soft: #D6D2C4;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background: var(--blue);
  color: var(--white);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  font-size: 17px;
  line-height: 1.8;
}

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 28px 30px;
}

/* SELECTOR DE IDIOMAS */
.language-bar {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 8px;
  font-size: 13px;
  line-height: 1.5;
}

.lang-link {
  padding: 0;
  border: 0;
  background: transparent;
  color: rgba(255,255,255,.78);
  font: inherit;
  cursor: pointer;
  text-decoration: none;
  transition: color .2s ease;
}

.lang-link:hover, .lang-link.active { color: var(--gold); }
.lang-link.active { font-weight: 700; }
.lang-divider { color: rgba(255,255,255,.45); user-select: none; }

/* ENCABEZADO */
header { text-align: center; margin-top: 16px; margin-bottom: 32px; }

h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 46px;
  line-height: 1.2;
  font-weight: bold;
  letter-spacing: .5px;
  color: var(--gold);
}

/* MENÚ */
.menu {
  width: min(850px, 100%);
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 72px;
  position: relative;
  margin-top: 4px;
}

.menu::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
  background: rgba(255,255,255,.25);
  transform: translateX(-50%);
}

.column { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.item { width: 100%; text-align: center; }

.item a {
  display: inline-block;
  color: #fff;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  font-size: 23px;
  line-height: 1.4;
  padding: 5px 10px;
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: color .2s ease, border-color .2s ease;
}

.item a:hover { color: var(--gold); border-bottom-color: var(--gold); }

/* INVITACIÓN A RECIBIR NUEVAS PUBLICACIONES */
.subscribe-panel {
  width: min(700px, 100%);
  margin: 38px auto 0;
  padding: 22px 28px 24px;
  background: transparent;
  border: none;
  border-radius: 0;
  color: inherit;
  text-align: center;
  box-shadow: none;
}

.subscribe-panel p {
  margin: 13px 0 0;
  color: rgba(255,255,255,.92);
  font-size: 14px;
  line-height: 1.5;
}

/* Botón dorado: visible, elegante y sin competir con el título */
.subscribe-button {
  display: inline-block;
  padding: 12px 21px;
  background: var(--gold);
  color: #17365D;
  border: 1px solid var(--gold);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  border-radius: 5px;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.5;
  text-decoration: none;
  box-shadow: 0 3px 10px rgba(0,0,0,.16);
  transition:
    background .2s ease,
    box-shadow .2s ease,
    transform .2s ease;
}

.subscribe-button:hover {
  background: #f0d987;
  box-shadow: 0 6px 15px rgba(0,0,0,.22);
  transform: translateY(-2px);
}

.subscribe-button:active {
  transform: translateY(0);
  box-shadow: 0 2px 6px rgba(0,0,0,.18);
}

.subscribe-button:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 4px;
}

/* VOLVER A INICIO */
.back { margin-top: 42px; text-align: center; }

.back a {
  color: var(--gold);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  font-size: 18px;
  line-height: 1.5;
  text-decoration: none;
  border-bottom: 1px solid rgba(231,201,111,.7);
  transition: color .2s ease, border-color .2s ease;
}

.back a:hover { color: #fff; border-color: #fff; }

/* CELULAR */
@media (max-width: 600px) {
  .page { align-items: flex-start; padding: 18px 24px 28px; }
  .language-bar { margin-bottom: 8px; justify-content: center; gap: 6px; }
  header { width: 100%; margin-top: 16px; margin-bottom: 28px; text-align: center; }
  h1 { font-size: 36px; line-height: 1.2; }
  .menu { display: block; width: 100%; margin-top: 0; }
  .menu::after { display: none; }
  .column { align-items: flex-start; gap: 9px; }
  .column + .column { margin-top: 9px; }
  .item { text-align: left; }
  .item a { font-size: 21px; line-height: 1.5; padding: 3px 0; }
  .subscribe-panel { margin-top: 30px; padding: 20px 17px 22px; }
  .subscribe-panel p { font-size: 15px; }
  .subscribe-button {
    max-width: 100%;
    padding: 11px 15px;
    font-size: 13px;
  }
  .back { width: 100%; margin-top: 32px; text-align: center; }
  .back a { font-size: 17px; }
}

/* RTL: Hebrew, Arabic and Persian */
html[dir="rtl"] .page { direction: rtl; }
html[dir="rtl"] .language-bar { justify-content: center; }
html[dir="rtl"] .menu { direction: rtl; }
html[dir="rtl"] .subscribe-panel { direction: rtl; }
html[dir="rtl"] .subscribe-panel p { font-family: Tahoma, Arial, sans-serif; }

html[dir="rtl"] .menu::after { left: 50%; }
@media (max-width: 600px) {
  html[dir="rtl"] .column { align-items: flex-start; }
  html[dir="rtl"] .item { text-align: right; }
}
</style>
</head>

<script>
(function () {
  const translations = {
    es: {
      title: "Mira, Crece y Comparte",
      documentTitle: "Mira, Crece y Comparte — La Palabra en Cápsulas",
      menuLabel: "Menú principal"

    he: {

      documentTitle: "התבונן, צמח ושתף — דבר אלוהים בקפסולות",

    },
    ar: {

      documentTitle: "تأمّل، انمُ وشارك — كلمة الله في كبسولات",
      menuLabel: "القائمة الرئيسية"
    },
    hi: {
      title: "देखें, बढ़ें और साझा करें",
      documentTitle: "देखें, बढ़ें और साझा करें — La Palabra en Cápsulas",

    },
    ru: {
      title: "Смотри, расти и делись",
      documentTitle: "Смотри, расти и делись — La Palabra en Cápsulas",
      menuLabel: "Главное меню"
    },
    de: {
      title: "Entdecken, wachsen und teilen",
      documentTitle: "Entdecken, wachsen und teilen — La Palabra en Cápsulas",
      menuLabel: "Hauptmenü"
    },
    ja: {
      title: "見て、成長し、分かち合う",
      documentTitle: "見て、成長し、分かち合う — La Palabra en Cápsulas",
      menuLabel: "メインメニュー"
    },
    tr: {
      title: "Bak, Geliş ve Paylaş",
      documentTitle: "Bak, Geliş ve Paylaş — La Palabra en Cápsulas",
      menuLabel: "Ana Menü"
    },
    el: {
      title: "Δες, Μεγάλωσε και Μοιράσου",
      documentTitle: "Δες, Μεγάλωσε και Μοιράσου — La Palabra en Cápsulas",
      menuLabel: "Κύριο μενού"
    },
    fa: {
      title: "ببین، رشد کن و به اشتراک بگذار",
      documentTitle: "ببین، رشد کن و به اشتراک بگذار — کلام در کپسول‌ها",
      menuLabel: "منوی اصلی"
    }
  };

  function changeLanguage(lang) {
    if (!translations[lang]) lang = "es";

    document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
    document.documentElement.dir = ["he", "ar", "fa"].includes(lang) ? "rtl" : "ltr";
    document.title = translations[lang].documentTitle;
    document.getElementById("page-title").textContent = translations[lang].title;
    document.getElementById("main-menu").setAttribute("aria-label", translations[lang].menuLabel);

    document.querySelectorAll("#main-menu a[data-es]").forEach(function (link) {
      link.textContent = link.getAttribute("data-" + lang) || link.getAttribute("data-es");
    });

    document.querySelectorAll("#subscribe-panel [data-es]").forEach(function (element) {
      element.textContent = element.getAttribute("data-" + lang) || element.getAttribute("data-es");
    });

    const backLink = document.getElementById("back-link");
    backLink.textContent = backLink.getAttribute("data-" + lang) || backLink.getAttribute("data-es");

    document.querySelectorAll(".lang-link").forEach(function (button) {
      const selected = button.id === "link-" + lang;
      button.classList.toggle("active", selected);
      button.setAttribute("aria-pressed", String(selected));
    });

    try {
      localStorage.setItem("lpc-language", lang);
      localStorage.setItem("user_language", lang);
    } catch (error) {
      // El menú sigue funcionando si el almacenamiento está desactivado.
    }
  }

  window.changeLanguage = changeLanguage;

  const urlParams = new URLSearchParams(window.location.search);
  const requestedLanguage = urlParams.get("lang");
  let initialLanguage = "es";

  try {
    initialLanguage = requestedLanguage || localStorage.getItem("lpc-language") ||
      localStorage.getItem("user_language") || "es";
  } catch (error) {
    initialLanguage = requestedLanguage || "es";
  }

  changeLanguage(initialLanguage);
})();
</script>
